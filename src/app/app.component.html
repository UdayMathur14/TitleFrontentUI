<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen()">
  @if (mobile() && sidebarOpen()) { <button class="scrim" aria-label="Close navigation" (click)="toggleSidebar()"></button> }
  <aside id="app-sidebar" class="sidebar" [class.open]="sidebarOpen()">
    <div class="brand">
      <div class="brand-mark"><lucide-icon [img]="icons.Sparkles" [size]="19" /></div>
      <div class="brand-copy"><strong>TitleFlow</strong><span>Operations suite</span></div>
      <button class="icon-button collapse" aria-label="Hide sidebar" (click)="toggleSidebar()"><lucide-icon [img]="icons.ChevronLeft" [size]="18" /></button>
    </div>
    <nav>
      <p class="nav-label">Workspace</p>
      <a routerLink="/dashboard" routerLinkActive="active"><lucide-icon [img]="icons.LayoutDashboard" [size]="19" /><span>Overview</span></a>
      <a routerLink="/titles" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"><lucide-icon [img]="icons.BookOpen" [size]="19" /><span>View All Titles</span></a>
      <a routerLink="/titles/upload" routerLinkActive="active"><lucide-icon [img]="icons.FileSpreadsheet" [size]="19" /><span>Import Titles</span></a>
      <p class="nav-label spaced">Publication Titles</p>
      <a routerLink="/publications" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"><lucide-icon [img]="icons.FileSpreadsheet" [size]="19" /><span>Title Validation</span></a>
      <a routerLink="/publications/records" routerLinkActive="active"><lucide-icon [img]="icons.BookCopy" [size]="19" /><span>View Publication Titles</span></a>
      <a routerLink="/publications/modified" routerLinkActive="active"><lucide-icon [img]="icons.FilePenLine" [size]="19" /><span>Modified Titles</span></a>
    </nav>
    <div class="profile">
      <div class="avatar">T</div><div><strong>Title Management</strong><span>Workspace</span></div>
    </div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <button class="icon-button menu" aria-label="Show sidebar" aria-controls="app-sidebar" [attr.aria-expanded]="sidebarOpen()" (click)="toggleSidebar()"><lucide-icon [img]="icons.Menu" [size]="21" /></button>
      <div class="top-actions"><a class="primary-action" routerLink="/titles"><lucide-icon [img]="icons.BookOpen" [size]="18" />View all titles</a><a class="primary-action" routerLink="/titles/upload"><lucide-icon [img]="icons.Plus" [size]="18" />Import</a><button class="logout-action" type="button" (click)="logout()"><lucide-icon [img]="icons.LogOut" [size]="17" />Logout</button></div>
    </header>
    <main><router-outlet /></main>
  </section>
</div>
